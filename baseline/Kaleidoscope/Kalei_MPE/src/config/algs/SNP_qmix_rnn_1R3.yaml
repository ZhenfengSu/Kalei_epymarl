# --- QMIX specific parameters ---

# use epsilon greedy action selector
action_selector: "epsilon_greedy"
epsilon_start: 1.0
epsilon_finish: 0.05
epsilon_anneal_time: 50000
evaluation_epsilon: 0.0

runner: "episode"

buffer_size: 5000

# update the target network every {} episodes
target_update_interval_or_tau: 200


obs_agent_id: True
obs_last_action: False
obs_individual_obs: False


# use the Q_Learner to train
standardise_returns: False
standardise_rewards: True

agent_output_type: "q"
learner: "q_learner"
agent: "SNP_rnn_1R3"
mac: "SNP_mac"
double_q: True
mixer: "qmix"
use_rnn: True
mixing_embed_dim: 32
hypernet_layers: 2
hypernet_embed: 64

# SNP-specific arguments
SNP_args:
  # Sparsity ratios for each of the 3 masked layers (fc2, fc3, fc4)
  # Values should be between 0.0 (no pruning) and 1.0 (complete pruning)
  # Higher values = more sparsity = less parameter sharing
  layers_sparsities:
    - 0.5  # Sparsity for fc2 (50% of neurons pruned)
    - 0.5  # Sparsity for fc3 (50% of neurons pruned)
    - 0.5  # Sparsity for fc4 (50% of neurons pruned)

  # Note: The SNP paper suggests experimenting with different sparsity ratios
  # Common configurations:
  # - Low sparsity (0.3-0.4): More parameter sharing, better sample efficiency
  # - Medium sparsity (0.5-0.6): Balanced sharing and agent-specific capacity
  # - High sparsity (0.7-0.8): Less sharing, more agent-specific capacity

name: "SNP_qmix_rnn_1R3"
